services:
  - type: web
    name: pkgfactory-mcp
    runtime: docker
    plan: standard
    dockerCommand: julia --project=/app --startup-file=no /app/bin/auth0-server.jl
    numInstances: 1
    envVars:
      - key: PORT
        value: "8080"
      - key: AUTH0_ISSUER
        sync: false
      - key: MCP_RESOURCE_URL
        sync: false
      - key: MCP_OPERATOR_SUBJECT
        sync: false
      - key: GITHUB_TOKEN
        sync: false
